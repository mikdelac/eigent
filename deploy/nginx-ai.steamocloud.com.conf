server {
  server_name ai.steamocloud.com;

  # Server API docs (server/ on :3001, routes prefixed with /api)
  location = /api/docs { proxy_pass http://127.0.0.1:3001/docs; }
  location = /api/redoc { proxy_pass http://127.0.0.1:3001/redoc; }
  location = /api/openapi.json { proxy_pass http://127.0.0.1:3001/openapi.json; }

  # Server API (auth, DB, triggers)
  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
  }

  # Brain API (backend/ on :5001)
  location ~ ^/(health|chat|messages|mcp|skills|workspace|files|task|model|browser|tools|oauth|install|uninstall|linkedin|remote-sub-agent|v1/tasks)(/|$) {
    proxy_pass http://127.0.0.1:5001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  # Web UI (dist-web)
  location / {
    root /var/www/eigent-web;
    try_files $uri $uri/ /index.html;
  }

  listen [::]:443 ssl ipv6only=on;
  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/ai.steamocloud.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ai.steamocloud.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  if ($host = ai.steamocloud.com) {
    return 301 https://$host$request_uri;
  }
  listen 80;
  listen [::]:80;
  server_name ai.steamocloud.com;
  return 404;
}
